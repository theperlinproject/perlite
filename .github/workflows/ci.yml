name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev zlib1g-dev clang lld
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3
      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y
          vcpkg install openssl:x64-windows zlib:x64-windows
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then extra="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"; fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $extra
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -E "perlin_api_"
      - uses: actions/upload-artifact@v4
        with:
          name: perlite-${{ matrix.os }}
          path: |
            build/perlite
            build/perlite.exe
            data/
