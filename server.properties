# Perlite server settings. Lines starting with # are comments; edit a value, then restart.
# Name shown in the server list and the LAN list. Any text without ';'.
server-name=Perlite Server
# Game mode for new players: survival, creative or adventure.
gamemode=survival
# true: players get gamemode above on every join. false: each player keeps their own game mode.
force-gamemode=false
# World difficulty: peaceful, easy, normal or hard.
difficulty=easy
# true lets players with permission run commands like /give and /tp.
allow-cheats=false
# Most players online at once.
max-players=20
# true: every player must be signed in to Xbox Live. Turn it on for servers open to the internet.
online-mode=false
# true: only players listed in allowlist.json can join (manage it with /allowlist).
allow-list=false
# Address to listen on. Empty listens on every network interface.
server-ip=
# Port players join on. Open it for TCP (the join request) and UDP (gameplay) in your firewall.
server-port=19132
# UDP port(s) for gameplay traffic: a port, or a first-last range, or public:local.
server-udp-ports=19132
# Show the server under Friends > LAN Games (UDP 7551 on the local network).
enable-lan-visibility=true
# Farthest chunk distance sent to players.
view-distance=12
# Chunk distance around players where blocks and mobs are ticked (4 to 12).
tick-distance=4
# Minutes before an idle player is kicked. 0 never kicks.
player-idle-timeout=30
# Threads for world generation and saving. 0 uses every core.
max-threads=8
# Name of the world folder under worlds/.
level-name=world
# Seed for a new world: a number or any text. Empty picks a random seed.
level-seed=
# Permission for players not listed in permissions.json: visitor, member or operator.
default-player-permission-level=member
# true: players must accept the server's resource packs to join.
texturepack-required=false
# None, Dropped (chat is hidden) or Disabled (the chat button is off).
chat-restriction=None
# Smallest packet size in bytes that is compressed (0 to 65535).
compression-threshold=1
# Packet compression: zlib or snappy.
compression-algorithm=zlib
# true lets clients generate far-away terrain themselves to see beyond view-distance.
client-side-chunk-generation-enabled=true
# Send block ids as hashes, as current clients expect.
block-network-ids-are-hashes=true
# true: persona (character creator) skins are not shown to other players.
disable-persona=false
# true: custom skins are replaced with the default skins.
disable-custom-skins=false
# Disconnect players who flood the server with packets.
enable-packet-rate-limiter=true
# Encrypt connections. Over NetherNet the handshake runs but DTLS already encrypts the stream.
network-encryption=true
# Log every packet sent and received while a player is joining.
debug-log-packets=false
# leveldb saves the world in worlds/<level-name>; none keeps it in memory only.
perlite-world-storage=leveldb
# Seconds between automatic saves. 0 saves only on stop and /save.
perlite-autosave-seconds=300
# Download the latest Bedrock Dedicated Server from minecraft.net on first start and keep only its vanilla behavior packs (mobs, block shapes, recipes, structures, loot); the Minecraft EULA applies: https://www.minecraft.net/eula.
perlite-download-vanilla-pack=true
# Terrain for new chunks: vanilla or flat.
perlite-generator=vanilla
# Layers of a flat world, bottom up: block*count separated by commas.
perlite-flat-layers=minecraft:bedrock*1,minecraft:dirt*2,minecraft:grass_block*1
# Folder with plugins. Empty uses plugins/ in the data folder.
perlite-plugin-dir=
# Folder with block data. Empty uses the data folder beside the program.
perlite-block-data-dir=
# Also download the vanilla behavior pack (see perlite-download-vanilla-pack) for its structure templates and loot tables; either setting turns the one download on.
perlite-download-structures=true
# A Bedrock vanilla behavior pack (from your own Bedrock Dedicated Server or game install) whose structures folder holds the village, outpost, bastion and other templates. Empty looks for behavior_packs/vanilla beside the server, then for the downloaded copy. Without it only structures built in code generate.
perlite-structure-pack=
# STUN/TURN servers for NetherNet, comma separated. Usually left empty.
perlite-ice-servers=
# Address NetherNet gameplay traffic is bound to. Empty uses all.
perlite-ice-bind-address=
# Extra trusted Xbox Live root keys, comma separated. Usually left empty.
perlite-auth-root-keys=
